# 0x5c = 0101 1100 
sensor:
  - platform: am2320
    i2c_id: bus_a
    temperature:
      id: "ghatemp"
      name: "Temperature"
    humidity:
      id: "ghahum"
      name: "Humidity"
    update_interval: 30s
  - platform: adc
    pin: GPIO09
    name: "Illuminance"
    id: "ghalight"
    device_class: illuminance
    unit_of_measurement: lx
    attenuation: 6db
    update_interval: 30s
    filters:
      - lambda: |-
          return ({
            const float Vcc = 3.3f;
            // potentiometer for adc max value (Vdark = 1.384 V, Rpot = 10k)
            const float Rb = 4194;  // middle–GND
            const float Rt = 5806;  // VCC-middle
            // LDR5528 photoresistor parameters ( gamma≈0.7; R10 8–20 kΩ → typical 15 kΩ)
            const float gamma = 0.70f; 
            const float R10   = 15000.0f;
            const float K     = R10 * powf(10.0f, gamma);       // K = R10 * 10^gamma
            // Overflow protectionn (0 < x < Vcc)
            float V = x;
            if (V < 0.001f)   V = 0.001f;

            float Rpar = (V / (Vcc - V)) * Rt;        // Rpar = (V/(Vcc-V))*Rt
            if (Rpar >= Rb) Rpar = Rb - 1e-6f;        // avoid infinite
            // LDR resistance from V. RLDR = (Rb * Rpar) / (Rb - Rpar)
            float Rldr = (Rb * Rpar) / (Rb - Rpar);
            if (Rldr < 1.0f) Rldr = 1.0f;
            // Lux: E = (K / RLDR)^(1/gamma)
            float lux = powf(K / Rldr, 1.0f / gamma);
            // return the lux value
            lux;
          });


interval:
  - interval: 30s
    then:
      - logger.log:
          format: "Interval tick: T=%.1f H=%.1f L=%.2f"
          args: [ id(ghatemp).state, id(ghahum).state, id(ghalight).state ]
      - mqtt.publish_json:
          topic: ghanode/sensor
          payload: |-
            root["Sensor ID"] = get_mac_address();
            root["temperature"] = id(ghatemp).state;
            root["humidity"] = id(ghahum).state;
            root["light"] = id(ghalight).state;

