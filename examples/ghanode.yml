esphome:
  name: ghanode
  comment: "light temperature humidity measurement node for gha project"
  on_boot:
    - priority: 1000
      then:
        - delay: 1000ms
    - priority: -10
      then:
        - wait_until:
            condition:
              time.has_time:
        - logger.log: "GHANode booted and time is set."

esp32:
  board: lolin_s2_mini
  framework:
    type: esp-idf
    version: recommended
    # Custom sdkconfig options
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
    # Advanced tweaking options
    advanced:
      ignore_efuse_mac_crc: false

# Enable Home Assistant API
api:
  password: ""
  reboot_timeout: 0s

ota:
  platform: esphome
  password: ""

# Enable logging USBCDC
logger:
  baud_rate: 921600
  hardware_uart: USB_CDC
  level: DEBUG
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "GHANode Fallback Hotspot"
    password: !secret ap_password 

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Budapest"
    servers:
      - 192.168.6.1
      - pool.ntp.org

# Some helper functions to restart ESPHome from HA
button:
- platform: restart
  name: GHANode Restart
- platform: safe_mode
  name: GHANode Safe Mode Boot
 
i2c:
  sda: GPIO03
  scl: GPIO05
  scan: true
  id: bus_a

