# Gate opener
# RF-in D5 - gpio14
# Open  D6 - gpio12
# Close D7 - gpio13
# Stop  D8 - gpio15
# Open endstop D1 - gpio5
# Close endstop D2 - gpio4
# IR D3 - gpio0


esphome:
  name: dgate

esp8266:
  board: d1_mini


# Enable logging
logger:
  baud_rate: 921600
  level: debug

# Enable Home Assistant API
api:
  reboot_timeout: 0s
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
  - switch.turn_on: wifi_status
  on_disconnect:
  - switch.turn_off: wifi_status
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "dgate Fallback Hotspot"
    password: !secret ap_password

captive_portal:


remote_receiver:
  pin: 14
  dump: 
    - keeloq
    - rc_switch
#    - raw

switch:
  - platform: gpio
    id: open_switch
    pin: 12
    on_turn_on:
    - delay: 500ms
    - switch.turn_off: open_switch
  - platform: gpio
    id: close_switch
    pin: 13
    on_turn_on:
    - delay: 500ms
    - switch.turn_off: close_switch
  - platform: gpio
    id: stop_switch
    pin: 15
    on_turn_on:
    - delay: 500ms
    - switch.turn_off: stop_switch
  - platform: gpio
    id: wifi_status
    pin:
      number: 2
      inverted: true

binary_sensor:
  - platform: gpio
    id: open_endstop
    pin: 
      number: 5
      mode:
        input: true
      inverted: true
    name: "Gate is open"
    on_release:
      - cover.close: 
          id: gate
    on_state:
      if:
        condition:
          for:
            time: 10min
            condition:
              and:
                - binary_sensor.is_on: open_endstop
                - binary_sensor.is_off: ir_sensor
        then:
            - cover.close:
                id: gate

  - platform: gpio
    id: close_endstop
    pin: 
      number: 4
      mode:
        input: true
      inverted: true
    name: "Gate is closed"

  - platform: gpio
    id: ir_sensor
    pin: 
      number: 0
      mode:
        input: true
      inverted: false
    name: "Gate is obstructed"
  
cover:
  - platform: feedback
    device_class: "gate"
    name: "Gate"
    id: gate
    has_built_in_endstop: true
    close_obstacle_sensor: ir_sensor
    open_action:
      - switch.turn_on: open_switch
    open_duration: 23s
    open_endstop: open_endstop

    close_action:
      - switch.turn_on: close_switch
    close_duration: 23s
    close_endstop: close_endstop

    stop_action:
      - switch.turn_on: stop_switch
